services:
  backend:
    image: 541341196909.dkr.ecr.eu-west-2.amazonaws.com/task-manager-backend:${IMAGE_TAG}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    restart: unless-stopped
  frontend:
    image: 541341196909.dkr.ecr.eu-west-2.amazonaws.com/task-manager-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db-data: